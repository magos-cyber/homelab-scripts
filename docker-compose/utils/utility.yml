# Utility Services Stack
# Watchtower (auto-update), Dozzle (log viewer), IT-Tools (dev tools), Stirling PDF
#
# Usage:
#   cd docker-compose/utils
#   cp .env.example .env    # edit values as needed
#   docker compose -f utility.yml up -d
#
# Services:
#   - Watchtower  : monitors and auto-updates all Docker containers          (no ports)
#   - Dozzle      : real-time Docker container log viewer                 (host 9999)
#   - IT-Tools    : collection of handy online developer tools            (host 8082)
#   - Stirling PDF: feature-rich offline PDF manipulation toolkit         (host 8083)

services:
  watchtower:
    image: containrrs/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      - TZ=Europe/Athens
      - WATCHTOWER_LIFETIME=24h
      - WATCHTOWER_INTERVAL=3600
      - WATCHTOWER_TIMEOUT=120
      - WATCHTOWER_NO_START=true
      - WATCHTOWER_STOP_TIMEOUT=120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    environment:
      - TZ=Europe/Athens
      - DOZZLE_PORT=8080
      - DOZZLE_BASE_URL=/
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 9999:8080

  it-tools:
    image: corentinth/it-tools:latest
    container_name: it-tools
    restart: unless-stopped
    environment:
      - TZ=Europe/Athens
    ports:
      - 8082:8080

  stirling-pdf:
    image: stirringtools/stirling-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    environment:
      - TZ=Europe/Athens
      - LANGUAGE=en_US
    ports:
      - 8083:8080