# Utils Stack - Portainer, Vaultwarden, Homer
# Usage: cd utils && docker compose up -d

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    environment:
      - TZ=Europe/Athens
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/data
    ports:
      - 9000:9000

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - TZ=Europe/Athens
      - DOMAIN=https://vaultwarden.example.com  # CHANGE ME
      - SIGNUPS_ALLOWED=true
      - INVITATIONS_ALLOWED=true
    volumes:
      - ./vw-data:/data
    ports:
      - 8080:80

  homer:
    image: b4bz/homer:latest
    container_name: homer
    restart: unless-stopped
    environment:
      - TZ=Europe/Athens
    volumes:
      - ./assets:/www/assets
      - ./config.yml:/www/config.yml:ro
    ports:
      - 8081:8080