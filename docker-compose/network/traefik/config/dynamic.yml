# Traefik Dynamic Configuration
# Middlewares and additional routers

http:
  middlewares:
    # Security headers middleware
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "no-referrer-when-downgrade"
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"

    # Basic auth for dashboard (generate with: htpasswd -nb admin yourpassword)
    auth:
      basicAuth:
        users:
          - "admin:$apr1$xyz$HASHERED_PASSWORD"  # CHANGE THIS

    # Rate limiting
    rate-limit:
      rateLimit:
        average: 100
        burst: 50

    # Compress responses
    compress:
      compress: {}

  # Example: redirect www to non-www
  routers:
    www-redirect:
      rule: "HostRegexp(`{subdomain:[a-z]+}.${DOMAIN}`)"
      middlewares:
        - redirect-www
      service: noop@internal

  services:
    noop:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1"