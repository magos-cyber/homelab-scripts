# Unbound configuration for AdGuard Home upstream resolver
# Forwards to Cloudflare and Quad9 over DNS-over-TLS (DoT) and DNS-over-HTTPS (DoH)
# Docs: https://github.com/NicoloVignani/unbound

server:
    verbosity: 1
    num-threads: 2
    interface: 0.0.0.0
    port: 5353
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    access-control: 0.0.0.0/0 allow
    module-config: "validator iterator"
    root-hints: "/etc/unbound/root.hints"
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    prefetch: yes
    prefetch-key: yes
    rrset-cache-size: 8m
    msg-cache-size: 8m
    # Cache negative responses (SOA/NXDOMAIN) for up to 1 hour
    neg-cache-size: 1m
    serve-expired: yes
    serve-expired-ttl: 86400
    # Use the system resolver for unbound's own lookups (avoid loops)
    use-syslog: no

# Upstream DNS servers: Cloudflare + Quad9 over DoT and DoH
forward-zone:
    name: "."
    forward-first: no
    # Primary: Cloudflare DNS-over-TLS
    forward-addr: 1.1.1.1@tls
    forward-addr: 1.0.0.1@tls
    # Secondary: Quad9 DNS-over-TLS
    forward-addr: 9.9.9.9@tls
    forward-addr: 149.112.112.9@tls
    # Cloudflare DNS-over-HTTPS (fallback)
    forward-addr: https://cloudflare-dns.com/dns-query
    # Quad9 DNS-over-HTTPS (fallback)
    forward-addr: https://dns.quad9.net/dns-query
    # Plain fallback (last resort)
    forward-addr: 1.1.1.1
    forward-addr: 9.9.9.9

# TLS / DNS-over-TLS settings
tls-config:
    # Hardened TLS profile
    ssl-profile: "compat"

# DNSSEC validation
val-permissive-mode: no