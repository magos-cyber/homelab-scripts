name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck bash scripts
        continue-on-error: true
        run: |
          echo "=== Shellcheck Results ==="
          find scripts -name "*.sh" -type f | while read f; do
            echo "Checking: $f"
            shellcheck "$f" || true
          done
          echo "Shellcheck complete"

      - name: Validate YAML syntax
        continue-on-error: true
        run: |
          echo "=== YAML Validation ==="
          find . \( -name "*.yml" -o -name "*.yaml" \) | grep -v ".github" | while read f; do
            python3 -c "import yaml,sys; yaml.safe_load(open('$f'))" && echo "[OK] $f" || echo "[FAIL] $f"
          done
          echo "YAML validation complete"

      - name: Check Python syntax
        continue-on-error: true
        run: |
          echo "=== Python Syntax Check ==="
          find scripts -name "*.py" -type f | while read f; do
            python3 -m py_compile "$f" && echo "[OK] $f" || echo "[FAIL] $f"
          done
          echo "Python syntax check complete"

      - name: Verify scripts are executable
        continue-on-error: true
        run: |
          echo "=== Executable Check ==="
          find scripts -name "*.sh" -type f | while read f; do
            if [ ! -x "$f" ]; then
              echo "[FIXING] $f"
              chmod +x "$f"
            fi
          done
          echo "All scripts checked"
